<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Goals and Achievements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky section bar on top; each section = exercise index (left rail) + stacked exercise cards. Gold stars = goals reached. */
:root{
  /* beige paper single theme */
  color-scheme:light;
  --bg:#f2eadb; --surface:#fbf6ec; --surface2:#efe5d3; --ink:#2b2520; --muted:#6d6151; --line:#ddcfb8;
  --accent:#1d6b66; --accent-ink:#ffffff; --accent-soft:#dbe8df;
  --gold:#c4860f; --gold-soft:#f5e1b3;
  --ok:#2e7a3c; --ok-soft:#dcefd9; --bad:#b03a2c; --bad-soft:#f6dcd3;
  --cb:#1d6b66; --wb:#4b4f96; --x:#a35a16;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:0 16px}
.bar-in .brand{flex:1}
.bar-in nav.tabs{order:3;flex:0 0 calc(100% + 24px);margin:0 -12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap;padding-block:12px;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 9px 11px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);font-size:15px}
nav.tabs button .l{font-family:var(--f-mono);font-size:12px;margin-right:6px;color:var(--accent)}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.stars{font-family:var(--f-mono);font-size:13px;background:var(--gold-soft);color:var(--ink);padding:6px 10px;border-radius:999px;white-space:nowrap}
.stars b{color:var(--gold)}

main{max-width:1200px;margin:0 auto;padding:24px 16px 80px}
.sec-head{display:grid;gap:8px;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sec-head h1{font-size:clamp(30px,5vw,48px);font-weight:800}
.sec-head p{margin:0;color:var(--muted);max-width:65ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;gap:6px;align-items:center}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 100px);overflow:auto;display:grid;gap:2px;padding-right:4px}
.rail a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.rail a img.emo{flex:0 0 18px;margin-top:-1px}
.rail a:hover{background:var(--surface)}
.rail a .n{font-family:var(--f-mono);font-size:11px;flex:0 0 58px;color:var(--muted)}
.rail a.done .n{color:var(--gold)}
.rail .grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.cards{display:grid;gap:20px;min-width:0}
@media (max-width:860px){.layout{grid-template-columns:1fr}.rail{display:none}}

/* exercise card */
.ex{display:flow-root;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px clamp(16px,3vw,28px) 22px;min-width:0;scroll-margin-top:120px}
.ex-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.code{font-family:var(--f-mono);font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid currentColor}
.src-cb{color:var(--cb)} .src-wb{color:var(--wb)} .src-x{color:var(--x)}
.ex h2{font-size:22px;font-weight:700}
.ex .star{margin-left:auto;font-size:20px;color:var(--line)}
.ex .star.on{color:var(--gold)}
.instr{color:var(--muted);margin:6px 0 14px;max-width:70ch}
.tip{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.tip b{font-family:var(--f-display)}
.ua{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.bank span{font-size:15px;padding:2px 9px;background:var(--surface2);border-radius:4px}
.bank span.used{opacity:.4;text-decoration:line-through}

ol.items{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:it}
ol.items>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:baseline}
ol.items>li::before{counter-increment:it;content:counter(it, lower-alpha);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
ol.items.num>li::before{content:counter(it)}
.q{min-width:0}

input.g,select.g{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:0;border-bottom:2px solid var(--muted);padding:1px 6px;min-width:6ch;border-radius:3px 3px 0 0}
select.g{padding-right:2px;max-width:100%}
input.g:focus,select.g:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft)}
input.wide{width:100%}
.ok{background:var(--ok-soft)!important;border-bottom-color:var(--ok)!important}
.no{background:var(--bad-soft)!important;border-bottom-color:var(--bad)!important}
.fix{font-family:var(--f-mono);font-size:13px;color:var(--ok);margin-left:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:baseline}
.seg button{border:1px solid var(--line);background:var(--surface2);padding:1px 10px;border-radius:999px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.seg button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opts{display:grid;gap:6px;margin-top:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;gap:10px}
.opts button .k{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts button.ok{border-color:var(--ok);background:var(--ok-soft)}
.opts button.no{border-color:var(--bad);background:var(--bad-soft)}
.opts.row{display:flex;flex-wrap:wrap}
.exp{font-size:14px;color:var(--muted);margin-top:4px}
.tok{cursor:pointer;border-radius:3px;padding:0 1px}
.tok:hover{background:var(--accent-soft)}
.tok.sel{background:var(--gold-soft);text-decoration:line-through;text-decoration-thickness:2px}
.tok.ok{background:var(--ok-soft)} .tok.no{background:var(--bad-soft)}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(.97)}
.result{font-family:var(--f-mono);font-size:14px;margin-left:4px}
.result.full{color:var(--ok)}

textarea{width:100%;min-height:140px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.wc{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:4px}
.wc.good{color:var(--ok)}
.model{margin-top:12px;background:var(--surface2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0}
.model p{margin:.4em 0}
.check{display:grid;gap:4px;margin:12px 0 0;padding:0;list-style:none}
.check label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
ul.plain{margin:6px 0 12px;padding-left:20px}

.passage{background:var(--surface2);border-radius:8px;padding:18px 20px;margin:0 0 16px;max-width:75ch}
.passage h3{font-size:20px;margin-bottom:6px}
.passage p{margin:.6em 0}
.passage .pn{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:6px}
.passage .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bubble{border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;background:var(--surface2);margin:8px 0;max-width:60ch}

.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--gold-soft);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.player .note{font-size:13px;color:var(--muted)}
.player{display:grid;gap:10px;background:var(--gold-soft);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prow .grow{flex:1}
.pp{min-width:112px}
.time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
select.speed{min-width:0;font-size:14px}
input.seek{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));cursor:pointer;margin:4px 0}
input.seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
input.seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.script .sent{cursor:pointer;border-radius:3px}
.script .sent:hover{background:var(--accent-soft)}
.script .sent.cur{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.script{margin:0 0 14px;font-size:15px;background:var(--surface2);padding:12px 16px;border-radius:8px}
.script p{margin:.4em 0}

.spellrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spellword{font-family:var(--f-display);font-size:22px;min-width:9ch;transition:filter .2s}
.spellword.hid{filter:blur(8px);user-select:none}

.chart{display:grid;gap:6px;margin:6px 0 16px;max-width:520px}
.chart .r{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:14px}
.chart .b{height:20px;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-family:var(--f-mono);font-size:12px}
.chart .m{background:var(--accent-soft);border:1px solid var(--accent)}
.chart .w{background:var(--gold-soft);border:1px solid var(--gold)}

.grid-home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;text-align:left;display:grid;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile .l{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.tile h3{font-size:20px}
.tile p{margin:0;font-size:14px;color:var(--muted)}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.goalpost{font-family:var(--f-mono);font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding-left:12px;display:grid;gap:4px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
@media (max-width:900px){.grid-home{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid-home{grid-template-columns:1fr}}
.timer{font-family:var(--f-mono);font-size:22px;min-width:5ch}
.fig{margin:0 0 16px}
.fig img{display:block;border-radius:8px;border:1px solid var(--line)}
.fig.wide img{width:100%;max-height:380px;object-fit:cover}
.fig.side{float:right;width:min(36%,270px);margin:0 0 14px 20px}
.fig.side img{width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:640px){.fig.side{float:none;width:100%;margin:0 0 14px}}
.track{font-family:var(--f-mono);font-size:12px;background:var(--surface);padding:3px 8px;border-radius:4px}

/* ---- emoji & illustrations (Fluent Emoji 3D, MIT) ---- */
img.emo{display:inline-block;vertical-align:middle;user-select:none;pointer-events:none}
nav.tabs button img.emo{width:22px;height:22px;margin-right:6px;margin-top:-3px}
.ex h2{display:flex;align-items:center;gap:10px}
.ex h2 img.emo{width:34px;height:34px;flex:0 0 34px}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:center;margin-bottom:22px}
.sec-grid .sec-head{margin:0}
.scene{position:relative;height:210px;border-radius:22px;background:radial-gradient(circle at 30% 35%,var(--gold-soft),transparent 60%),radial-gradient(circle at 75% 70%,var(--accent-soft),transparent 60%),var(--surface2);overflow:hidden}
.scene img.emo{position:absolute;filter:drop-shadow(0 8px 10px rgba(80,55,20,.22));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(calc(var(--r,0deg) + 4deg))}}
.hero .scene{height:230px;margin-bottom:16px}
@media (max-width:860px){.sec-grid{grid-template-columns:1fr}.sec-grid .scene{height:150px}}
.strip{position:relative;height:118px;border-radius:14px;margin:0 0 16px;background:linear-gradient(100deg,var(--gold-soft),var(--accent-soft));overflow:hidden;display:flex;align-items:center;justify-content:space-evenly;padding:0 10px}
.strip img.emo{width:78px;height:78px;filter:drop-shadow(0 6px 8px rgba(80,55,20,.2));animation:bob 6s ease-in-out infinite}
.strip img.emo:nth-child(odd){--r:-8deg;animation-delay:-2s}
.strip img.emo:nth-child(even){--r:7deg;width:64px;height:64px}
@media (max-width:560px){.strip{height:90px}.strip img.emo{width:54px;height:54px}.strip img.emo:nth-child(even){width:46px;height:46px}}
.tile{position:relative}
.tile img.emo{position:absolute;top:12px;right:12px;width:52px;height:52px;filter:drop-shadow(0 5px 6px rgba(80,55,20,.2))}
.tile h3{padding-right:56px}
.result img.emo{width:24px;height:24px;margin-right:4px}
.actions{position:relative}
.burst{position:absolute;width:34px;height:34px;left:40px;top:0;pointer-events:none;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){.scene img.emo,.strip img.emo{animation:none}.burst{display:none}}
.footnote{font-size:13px;color:var(--muted);margin-top:40px;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Unit 1 <small>GOALS &amp; ACHIEVEMENTS</small></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="stars" id="stars" title="Exercises completed with 100%">★ <b id="starN">0</b>/<span id="starT">0</span></div>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};
const norm=s=>(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[–—]/g,'-').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim().replace(/[.!?;:,]+$/,'').trim();
const normS=s=>norm(s).replace(/[“”"]/g,'').replace(/\s*,\s*/g,', ');
const shuffle=(a,seed=7)=>{a=a.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('u1:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('u1:'+k,JSON.stringify(v))}catch(e){}}};
let scores=store.get('scores',{});

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(lines,onend){
  try{speechSynthesis.cancel()}catch(e){if(onend)onend();return false}
  const gb=voices.filter(v=>/GB|UK/i.test(v.lang+v.name));const pool=(gb.length>1?gb:voices);
  lines.forEach((ln,i)=>{const u=new SpeechSynthesisUtterance(ln.t);u.lang='en-GB';u.rate=ln.rate||0.92;
    const vi=ln.v||0; if(pool.length) u.voice=pool[vi%pool.length]; u.pitch=vi%2?1.15:0.95;
    if(i===lines.length-1&&onend)u.onend=onend; speechSynthesis.speak(u)});
  return true;
}
let activePlayer=null;
function stopSpeak(){if(activePlayer)activePlayer.pause();try{speechSynthesis.cancel()}catch(e){}}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function makePlayer(ex){
  const segs=[];
  ex.audio.forEach((l,li)=>{(l.t.match(/[^.!?…]+(?:[.!?…]+["'’”)]*|$)\s*/g)||[l.t]).forEach(t=>{t=t.trim();if(t)segs.push({t,v:l.v||0,li})})});
  let acc=0;segs.forEach(sg=>{sg.start=acc;acc+=sg.t.length+8});const total=acc;
  const CPS=14;let idx=0,pos=0,playing=false,token=0,rate=0.95,t0=0;
  const secs=c=>c/(CPS*rate);
  const bPlay=el('button',{class:'btn primary pp',type:'button'},'▶ Play');
  const bBack=el('button',{class:'btn',type:'button',title:'Back one sentence','aria-label':'Back one sentence'},'◂◂');
  const bFwd=el('button',{class:'btn',type:'button',title:'Forward one sentence','aria-label':'Forward one sentence'},'▸▸');
  const range=el('input',{type:'range',class:'seek',min:'0',max:String(total),step:'1',value:'0','aria-label':'Position in recording'});
  const time=el('span',{class:'time'},'0:00');
  const speed=el('select',{class:'g speed','aria-label':'Speed'},...[['0.75','0.75×'],['0.95','1×'],['1.15','1.25×']].map(([v,l])=>{const o=el('option',{value:v},l);if(v==='0.95')o.selected=true;return o}));
  const spans=[];
  const scr=el('div',{class:'script',hidden:''});
  ex.audio.forEach((l,li)=>{const p=el('p',{},l.who?el('b',{},l.who+': '):null);segs.forEach((sg,i)=>{if(sg.li!==li)return;const sp=el('span',{class:'sent',onclick:()=>seek(i,true)},sg.t+' ');spans[i]=sp;p.append(sp)});scr.append(p)});
  const bScr=el('button',{class:'btn',type:'button',onclick:()=>{scr.hidden=!scr.hidden;bScr.textContent=scr.hidden?'Show transcript':'Hide transcript'}},'Show transcript');
  function render(){range.value=pos;range.style.setProperty('--p',(pos/total*100)+'%');time.textContent=fmt(secs(pos))+' / '+fmt(secs(total));
    spans.forEach((sp,i)=>sp.classList.toggle('cur',i===idx&&(playing||pos>0)));
    bPlay.textContent=playing?'❚❚ Pause':(pos>0?'▶ Resume':'▶ Play')}
  function speakSeg(){
    if(idx>=segs.length){playing=false;idx=0;pos=0;render();return}
    const my=++token;const sg=segs[idx];
    const gb=voices.filter(v=>/GB|UK/i.test(v.lang+v.name));const pool=(gb.length>1?gb:voices);
    const u=new SpeechSynthesisUtterance(sg.t);u.lang='en-GB';u.rate=rate;if(pool.length)u.voice=pool[sg.v%pool.length];u.pitch=sg.v%2?1.15:0.95;
    u.onend=()=>{if(my!==token||!playing)return;idx++;pos=idx<segs.length?segs[idx].start:total;speakSeg()};
    pos=sg.start;t0=performance.now();
    try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){playing=false;scr.hidden=false}
    render()}
  setInterval(()=>{if(!playing)return;const sg=segs[idx];if(!sg)return;pos=Math.min(sg.start+(performance.now()-t0)/1000*CPS*rate,sg.start+sg.t.length+7);render()},200);
  const api={
    play(){if(activePlayer&&activePlayer!==api)activePlayer.pause();activePlayer=api;playing=true;speakSeg()},
    pause(){if(!playing)return;playing=false;token++;try{speechSynthesis.cancel()}catch(e){}render()}};
  function seek(i,start){idx=Math.max(0,Math.min(segs.length-1,i));pos=segs[idx].start;if(playing)speakSeg();else if(start)api.play();else render()}
  const idxAt=v=>{let i=0;segs.forEach((sg,k)=>{if(sg.start<=v)i=k});return i};
  bPlay.onclick=()=>playing?api.pause():api.play();
  bBack.onclick=()=>seek(idx-1);bFwd.onclick=()=>seek(idx+1);
  range.addEventListener('input',()=>{pos=+range.value;idx=idxAt(pos);time.textContent=fmt(secs(pos))+' / '+fmt(secs(total));range.style.setProperty('--p',(pos/total*100)+'%')});
  range.addEventListener('change',()=>seek(idxAt(+range.value)));
  speed.addEventListener('change',()=>{rate=+speed.value;if(playing)speakSeg();else render()});
  render();
  const wrap=el('div',{},
    el('div',{class:'player'},
      el('div',{class:'prow'},bBack,bPlay,bFwd,time,el('span',{class:'grow'}),ex.track?el('span',{class:'track'},ex.track):null,speed),
      range,
      el('div',{class:'prow'},bScr,el('span',{class:'note'},'Official audioscript read by your browser’s voice. Drag the bar or click any sentence in the transcript to jump there.'))),
    scr);
  return wrap;
}

/* ---------- inline parsing ---------- */
// choice: [opt|*correct|opt]   gap: {ans|alt}   dropdown gap uses bank
function parseInline(text,ctrls,opts={}){
  const frag=document.createDocumentFragment();
  const re=/\[([^\]]+)\]|\{([^}]+)\}/g;let last=0,m;
  while((m=re.exec(text))){
    frag.append(document.createTextNode(text.slice(last,m.index)));last=re.lastIndex;
    if(m[1]){ // choice
      const parts=m[1].split('|');const seg=el('span',{class:'seg',role:'group'});let pick=null;
      const correct=parts.find(p=>p.startsWith('*')).slice(1);
      const btns=parts.map(p=>{const t=p.replace(/^\*/,'');const b=el('button',{type:'button','aria-pressed':'false',onclick:()=>{btns.forEach(x=>{x.setAttribute('aria-pressed','false');x.classList.remove('ok','no')});b.setAttribute('aria-pressed','true');pick=t}},t);b.dataset.t=t;return b});
      seg.append(...btns);frag.append(seg);
      ctrls.push({check(){btns.forEach(x=>x.classList.remove('ok','no'));const b=btns.find(x=>x.dataset.t===pick);const r=pick===correct;if(b)b.classList.add(r?'ok':'no');return r},
        reveal(){btns.forEach(x=>{x.classList.remove('no');x.setAttribute('aria-pressed',x.dataset.t===correct?'true':'false');if(x.dataset.t===correct)x.classList.add('ok')});pick=correct},
        reset(){pick=null;btns.forEach(x=>{x.setAttribute('aria-pressed','false');x.classList.remove('ok','no')})}});
    }else{ // gap
      const ans=m[2].split('|');let inp;
      if(opts.dropdown){inp=el('select',{class:'g'},el('option',{value:''},'…'),...opts.bank.map(b=>el('option',{value:b},b)))}
      else{inp=el('input',{class:'g',type:'text',autocomplete:'off',spellcheck:'false',size:Math.max(6,Math.min(28,ans[0].length+2))})}
      const fx=el('span',{class:'fix'});frag.append(inp,fx);
      ctrls.push({check(){inp.classList.remove('ok','no');const v=norm(inp.value);const r=opts.loose?(v.length>2&&ans.some(a=>v.includes(norm(a)))):ans.some(a=>norm(a)===v);inp.classList.add(r?'ok':'no');return r},
        reveal(){inp.value=ans[0];inp.classList.remove('no');inp.classList.add('ok');fx.textContent=ans.length>1?' ('+ans.slice(1).join(' / ')+')':''},
        reset(){inp.value='';inp.classList.remove('ok','no');fx.textContent=''}});
    }
  }
  frag.append(document.createTextNode(text.slice(last)));return frag;
}

  if(ex.tip)c.append(el('div',{class:'tip',html:ex.tip}));
  if(ex.passage)c.append(el('div',{class:'passage',html:ex.passage}));
  if(ex.audio)c.append(makePlayer(ex));
  const body=el('div',{});c.append(body);
  (R[ex.type]||(()=>{}))(ex,body,ctrls);
  if(ctrls.length){const res=el('span',{class:'result'});
    c.append(el('div',{class:'actions'},
      el('button',{class:'btn primary',type:'button',onclick:e=>{const n=ctrls.filter(k=>k.check()).length;const full=n===ctrls.length;res.innerHTML='';res.append(EM(full?'hundred_points':(n>=ctrls.length/2?'flexed_biceps':'seedling'),24),`${n} / ${ctrls.length}`+(full?' · Perfect!':' · keep going'));res.classList.toggle('full',full);burst(e.target.parentNode,full);if(n===ctrls.length){scores[ex.id]=1;star.classList.add('on');store.set('scores',scores);updStars()}}},'Check'),
      el('button',{class:'btn',type:'button',onclick:()=>{ctrls.forEach(k=>k.reveal());res.textContent='answers shown';res.classList.remove('full')}},'Show answers'),
      el('button',{class:'btn',type:'button',onclick:()=>{ctrls.forEach(k=>k.reset());res.textContent=''}},'Reset'),res));
  }
  if(ctrls.length&&!allEx.includes(ex.id))allEx.push(ex.id);
  return c;
}

{id:'a6',img:'img/haleena.jpg',imgAlt:`Haleena K, the blogger`,imgMode:'side',cap:`Haleena K – the writer of the blog`,src:'cb',code:'A6',title:'Reading for gist: “Plan your life – or not?”',type:'mcq',
 instr:`Read the blog quickly to get the general idea, then answer the questions.`,
 passage:`<div class="meta">HALEENA K · MAKE EVERY DAY COUNT · 8 January 2022</div><h3>Plan your life – or not?</h3>
<p>Some of you have been asking for my tips on how to set goals (yes, it’s that time of year!). I find it interesting that, when we were five, our teachers gave us gold stars and smiley face stickers for reaching our targets – and that habit of wanting to ‘tick off’ our progress on a chart has never really left us! So, let’s talk about goal setting.</p>
<p>A cousin of mine set his heart on studying law at a top university – to the surprise of his family as he had never been a high flyer at school. But he worked like crazy, got accepted at the university – and allowed himself one night of celebration before setting himself a new target: a first-class degree. There followed three years of head-down study (with zero social life), then he did a Master’s degree and more years of work… He had barely received his certificate before he disappeared to volunteer in a stray animal shelter in Malaysia, where he’s lived very happily ever since. It took him seven years to admit to himself that he loathed law: he just had to keep pursuing that next goal.</p>
<p>OK, so don’t set the wrong goals in the first place – but sometimes it’s hard to be sure of what we really want until we get it. There’s nothing wrong with having aspirations and taking a few chances, but the secret is not to make the end goal itself the only thing that matters. Make sure you enjoy the process of getting there, and reward yourself for the small milestones you reach along the way. So if it turns out the destination itself isn’t what you thought you wanted, you haven’t made the journey for nothing.</p>
<p>Another mistake we often make is to focus solely on that one small point on the horizon – our distant goal – without allowing ourselves to see things that unexpectedly enter our peripheral vision. (A bit like a wildlife photographer unsuccessfully scanning the sky all day for eagles and ignoring the rare butterfly that lands on her camera case.) Sometimes happiness comes from unexpected directions: keep your eyes and your mind open to opportunities.</p>
<p>Remember, too, that you may not have the total control over your goals that you think you do. All sorts of obstacles can hold you back (family issues, illness, money), or your schedule may be unrealistic. (If you’ve never run before, you’re not going to complete a marathon next week!) The key here is flexibility – and not to beat yourself up. Be honest with yourself – and move the goalposts. Move them as often as you like!</p>`,
 items:[
 {q:`What type of text is it?`,o:[`a news report`,`a personal blog post`,`a formal letter`],a:1,e:`It has a date, the writer’s name and the blog title; it talks directly to readers.`},
 {q:`What is its purpose?`,o:[`to give advice about setting goals`,`to sell a planning app`,`to report research about goals`],a:0},
 {q:`Who is it written for (the ‘audience’)?`,o:[`law students`,`the writer’s regular readers, who asked for tips`,`teachers of young children`],a:1,e:`“Some of you have been asking for my tips…”`},
 {q:`What sort of person might have written it?`,o:[`a lifestyle blogger sharing her own experience`,`a university professor`,`a journalist interviewing an expert`],a:0}]},

{id:'wa2',src:'wb',code:'WB A2',title:'Vocabulary check: Khalid the vet',type:'gap',para:true,
 instr:`Use the words in the box to complete the text. You may need to change the form of some of the verbs.`,
 bank:[`volunteer`,`flexibility`,`pursue`,`aspirations`,`honest`,`obstacles`,`rewards`,`focus`,`realistic`,`admit`,`process`],
 items:[`Children’s {aspirations} often change as they get older – one minute they want to be a train driver, the next an astronaut. Khalid, however, knew from a young age that he wanted to become a vet. He realised that it would be a long and difficult {process} and that there would be lots of {obstacles} to overcome. Despite this, he {pursued} his goal with great determination.`,
 `Every day at school, he {focused|focussed} on his studies. At weekends, he {volunteered} at a local veterinary surgery. He didn’t mind working for free, as he knew the experience offered many valuable {rewards} – essential experience with animals, improved chances of being {admitted} to the best university and some excellent contacts in the veterinary field, to name just a few.`,
 `Khalid was successful in gaining entry to his preferred university and graduated two years ago. So what does Khalid say is the key to success? ‘I think {flexibility} is very important – being able to change your goals if you need to and adapt to any situation are great skills to have. Also, you have to be totally {honest} with yourself about what it is you really want and whether or not you can actually achieve it. Your goals have to be {realistic}, or you’ll never achieve them!’`]},
{id:'wa3',src:'wb',code:'WB A3',title:'Reading for gist: A great thinker',type:'choice',
 instr:`Read the text about Albert Einstein and choose the correct word from each pair.`,num:true,
 items:[`How much do you know about Albert Einstein? If you’ve heard about him but don’t know much about his life and work, then read on! Scientists used to think that matter could not be created nor destroyed. However, in the first few years of the 20th century, Einstein came [out|*up] with a different idea.`,
 `Einstein’s idea – his Theory of Relativity – was first proved [by|*in] 1932. Einstein showed us that a small amount of matter could be changed into a vast amount of energy. This made the development of nuclear energy [available|*possible].`,
 `Born in 1879, Einstein was an unusual child; I was fascinated to learn that he didn’t speak until he was 3 years old! When he was 12, he [learnt|*taught] himself Euclidean geometry. He hated school, however, and at the age of 15, he used the fact that the family had moved house as an [*excuse|explain] for not going to school for a year.`,
 `Einstein grew into a brilliant and [*imaginative|imagining] young man who was [*passionately|perfectly] interested in science. He was also a very lively correspondent and [did|*made] a point of replying to any letters he received from children.`,
 `His intelligent, friendly face with its untidy mop of silvery hair is well-known, [apart|*yet] as a young man he had short, coal-black hair. The face of the Jedi Master Yoda in the Star Wars films was [copied|*inspired] by Einstein’s wise expression.`,
 `Sadly, Einstein’s theories were used to develop nuclear weapons. Einstein never [*forgave|upset] himself for what his discoveries had led to. Shortly before he died in 1955, he wrote a letter urging scientists to unite to [predict|*prevent] the possibility of another nuclear war.`]},

{id:'b4',src:'cb',code:'B4',title:'Listening: how people react to challenges',type:'select',track:'Track 1.1',
 instr:`Listen to the five speakers. Which speaker…?`,
 options:[`Speaker 1`,`Speaker 2`,`Speaker 3`,`Speaker 4`,`Speaker 5`],
 audio:[{who:'Speaker 1',v:0,t:`I used to bite my nails all the time, and I’d tried several times to give up, without success. I just didn’t seem to have the mental strength to quit. But when I was about 12, my mum promised she’d buy me a phone I really wanted if she didn’t have to see those horrible bitten nails anymore – and I stopped the habit within two days! So, unfortunately, that experience made me realise I’m much more likely to succeed at things when I’m promised some kind of reward.`},
 {who:'Speaker 2',v:1,t:`I’ve always been the kind of person who likes to look like everyone else and not draw attention to herself. So when a friend decided to shave off all the hair on her head to raise money for a cancer charity event, she thought I was joking when I agreed to take on the same challenge myself. Surprisingly, I didn’t mind having my hair shaved – but walking into school next day was one of the hardest things I’ve ever done, as I was expecting people to laugh and stare at me. Everyone was really nice about it though.`},
 {who:'Speaker 3',v:2,t:`In my head, there’s one of those photos that you see on social media of me screaming with terror and laughter as I throw myself off a very high platform with a rope tied around my feet. You know, those bungee jump things that people do to impress their friends, and then they buy the photo to prove they did it. What actually happened, sadly, is that I froze as I was standing on the platform, and I had to admit to myself that I just wasn’t brave enough to do it.`},
 {who:'Speaker 4',v:3,t:`I’d always dreamed of walking the whole of the 450-kilometre King’s Trail in Sweden, north of the Arctic Circle. But when I finally did it, it was tougher than I’d imagined: I was exhausted from the long distances carrying a heavy backpack, wet from the constant rain showers and covered in mosquito bites! So you’d think that I would have been quite pleased when I finished it, wouldn’t you? But it was quite the opposite: there’s something magical about that place, and I wanted the trail to go on for ever.`},
 {who:'Speaker 5',v:4,t:`It might be hard to believe this now, but as a kid I was really shy. Something that helped me to get over this was a trip to the UK to do a language course when I could speak hardly any English. One day, our teacher sent us out into the street to find some native English speakers to practise interviewing. You can imagine how nervous I was, approaching strangers, but I found myself talking to some lovely people – and that experience took away much of my fear and helped me believe in myself.`}],
 items:[{q:`regrets that they couldn’t complete their challenge?`,a:`Speaker 3`},{q:`felt sad when their challenge was over?`,a:`Speaker 4`},{q:`thinks the challenge has made them more confident?`,a:`Speaker 5`},{q:`learnt something about themselves that they don’t like?`,a:`Speaker 1`},{q:`was surprised by other people’s reactions after they completed their challenge?`,a:`Speaker 2`}]},

{id:'b7',img:'img/fears.jpg',imgAlt:`Facing Fears – magazine article header`,imgMode:'wide',cap:``,src:'cb',code:'B7',title:'Reading: textual organisation',type:'select',
 instr:`Read the text carefully and match each paragraph (1–7) with a heading.`,
 passage:`<h3>Monica’s story</h3>
<p><span class="pn">1</span>Monica Chand’s childhood memories are of terrible stomach aches each morning before school, of missing lessons through illness and falling so far behind that she understood little but did not dare to ask for help, and of silent misery as children bullied her. She says, ‘When I had Sally, 17 years ago, I was determined it would not be the same for her.’ She is sitting in her tidy flat, drinking tea. Sally, her teenage daughter, joins us.</p>
<p><span class="pn">2</span>Monica is describing how it feels to be unable to read and write in a world where just about everything we do, and how we are judged, depends on our literacy skills. Few people, she says, realise what it means to be unable to read a road sign, safety instructions or the contents of a food packet, or how it feels when every form you have to fill in is an impossible task. Few understand what people do to disguise their inability to read and write. Monica explains, ‘I would have the names of places I wanted to go to written down, and then I’d show this and ask someone to help, explaining that I’d left my glasses at home or some such story. You get good at fooling other people, but you can’t fool yourself.’</p>
<p><span class="pn">3</span>Her husband, Ravi, who died earlier this year, was unaware of her secret. She says, ‘I’d just ask him to do the things I couldn’t cope with and he accepted that. But it really came home to me when Sally was born. I felt very insecure as a mother, and as she grew up everyone around me was saying, “You must read to her.” I felt so stupid because I couldn’t.’ Even then she did not tell Ravi, although she smiles now and says, ‘I think he must have known in his heart of hearts, but he was such a sweet man he never let on. I made sure he did the reading with Sally – I’d say I had to cook dinner and that it was a good way for them to be close.’</p>
<p><span class="pn">4</span>Things changed when Sally went to primary school, and Monica became a volunteer in the school, helping children. One morning the headteacher said they wanted to offer her a paid job as a helper. ‘I just froze. I knew that would involve reading and writing – the things I’d avoided so far. But the headteacher had recognised my problem. She did reading with me every day so that I could take the job. As I learnt, she put me in with older children, and I realised I could read and write. It was like a miracle.’</p>
<p><span class="pn">5</span>Then Monica joined a parents’ group, and the new headteacher asked them to write a book for parents teaching their children. Monica says, ‘My first reaction was, “Ooh, I can’t do that,” but then I realised I could contribute – to help other parents like me.’ By now, she was doing a training course to become a parent-educator. ‘The day I got my certificate – the first in my life – Sally and I went out for a really nice meal to celebrate.’</p>
<p><span class="pn">6</span>These struggles are in the past. Monica works in several schools and has just returned from a conference in Cyprus where she gave a presentation on involving parents in reading. She also has a highly successful blog, which gets thousands of hits from users who post comments about her inspirational ideas.</p>
<p><span class="pn">7</span>Monica talks about her daughter, Sally. ‘Perhaps I pushed her harder than other parents because I knew what failing feels like, and I suppose I was living my life through her. But we were both bursting with pride the day she did really well in her exams. I was in tears in front of everyone at school.’ Sally is no less proud. She is sitting on the arm of the sofa near her mother, listening, and her smile is warm. She says, ‘I think it was brave of Mum. She’s also shown me how important it is to take opportunities when they come.’</p>`,
 num:true,
 items:[{q:`Paragraph 1`,a:`Unhappy school days`},{q:`Paragraph 2`,a:`Hiding the problem`},{q:`Paragraph 3`,a:`Sally’s birth`},{q:`Paragraph 4`,a:`Learning to read`},{q:`Paragraph 5`,a:`Qualifying as a parent-educator`},{q:`Paragraph 6`,a:`Monica’s work today`},{q:`Paragraph 7`,a:`Effects on Sally’s education`}]},

{id:'wb3',src:'wb',code:'WB B3',title:'Listening: what makes you laugh?',type:'select',track:'Workbook Audio 1',
 instr:`You will hear three people talking about what makes them laugh. Match a sentence with each speaker. There are two extra sentences you do not need – choose “not used”.`,
 options:[`Speaker 1`,`Speaker 2`,`Speaker 3`,`not used`],
 audio:[{who:'Speaker 1',v:0,t:`I think I have a similar sense of humour to most of my friends, especially my best friend. There’s nothing better than having a good laugh with someone – you somehow feel so much better afterwards. It occasionally causes problems, though, because for some strange reason, I find some serious situations, like school assemblies, incredibly funny. I can usually control my laughter, but from time to time, I can’t hold it in and end up getting into trouble. I’m not quite sure why I find things like that as amusing as funny films, but I do.`},

 {who:'Speaker 3',v:2,t:`I’ve noticed for a while now that when I go to the cinema with a group of friends to see something funny, they’ll laugh at the parts of the film that I just don’t find funny, and I’ll be roaring with laughter while they’re sitting there stony-faced. My best friend’s the exception, as he’s amused by the same scenes as me. It just goes to show that there’s nothing universal about humour – it’s as individual as all our other likes and dislikes.`}],

{id:'c3',src:'cb',code:'C3',title:'Negative prefixes',type:'gap',
 instr:`Make the opposites by adding <b>dis-, im-, in-, ir-</b> or <b>un-</b>. Type the whole word.`,
 tip:`<b>Rules of thumb:</b> <b>ir-</b> before r (irresponsible) · <b>im-</b> often before m or p (immature, impatient) · <b>il-</b> before l (illegal) · <b>un-</b> and <b>in-</b> are the most common – check a dictionary.`,
 items:[`responsible → {irresponsible}`,`secure → {insecure}`,`efficient → {inefficient}`,`loyal → {disloyal}`,`trustworthy → {untrustworthy}`,`considerate → {inconsiderate}`,`mature → {immature}`,`reliable → {unreliable}`,`honest → {dishonest}`]},

{id:'c4',img:'img/alex.jpg',imgAlt:`Alexander, a smiling young entrepreneur with a tablet`,imgMode:'side',cap:`Alexander, a successful entrepreneur`,src:'cb',code:'C4',title:'What are they like?',type:'open',

 instr:`Look at this photo of Alexander, a successful entrepreneur. Make some guesses about his personality using <i>He looks…</i> or <i>-looking</i>.`,placeholder:`He looks…`},
{id:'c5',src:'cb',code:'C5',title:'Demonstrating qualities through actions',type:'mcq',inline:true,
 passage:`<p>Alexander was 17 when he started his own business selling mobile phones. He became a multi-millionaire at 21. Alex now shares his business skills to help others start their own small business, especially in areas of high unemployment. Here is what people who worked with him say:</p>
<div class="bubble">When he’s deciding whether to invest in a business idea, he gets negative comments, such as ‘It’s not worth it, Alex; that project is a waste of money. The applicant is too uneducated to do well.’ But he doesn’t think like that. He believes everyone deserves a chance to succeed.</div>
<div class="bubble">He has invested in small businesses with no guarantee of success, but he says that it was worth it because now, all over the world, people are running a business they are proud of.</div>
<div class="bubble">He thinks there are still huge economic problems and lots of poverty. But he reminds us that if we make the world a fairer place, everyone will benefit.</div>
<div class="bubble">When he hears about an exciting project, he’s filled with enthusiasm. He relies on colleagues saying, ‘Wait a minute Alex, you’ve got to do this or do that to avoid disaster.’</div>
<div class="bubble">He thinks that encouraging people to believe in their future is vital. Even if others think he is too optimistic, he just has to do what he thinks is right.</div>`,
 instr:`Can we draw these conclusions about Alex? Alex has…`,
 items:[{q:`the courage to take risks`,o:[`Yes`,`No`],a:0},{q:`benefited from positive advice`,o:[`Yes`,`No`],a:1,e:`The advice he gets is negative, and he ignores it.`},{q:`bad memories he cannot forget`,o:[`Yes`,`No`],a:1},{q:`accepted stress as part of his life`,o:[`Yes`,`No`],a:1},{q:`support from people around him`,o:[`Yes`,`No`],a:0,e:`He relies on colleagues to warn him.`},{q:`trouble trusting others`,o:[`Yes`,`No`],a:1},{q:`self-belief`,o:[`Yes`,`No`],a:0},{q:`a positive outlook`,o:[`Yes`,`No`],a:0},{q:`determination`,o:[`Yes`,`No`],a:0},{q:`difficulty adjusting to change`,o:[`Yes`,`No`],a:1}]},
{id:'c6',src:'cb',code:'C6',title:'Criticising negative qualities',type:'open',
 tip:`We often use <b>tentative</b> language to avoid being too direct:<br><i>She’s immature.</i> → <i>She’s a bit immature at times.</i><br><i>He’s unreliable.</i> → <i>He’s not always very reliable.</i><br><i>He’s inconsiderate.</i> → <i>He can be rather inconsiderate.</i>`,
 instr:`You are a colleague of Alex’s who admires him but doesn’t always agree with what he does. Write some slight criticisms of him, using the comments in C5. Would you criticise people this tentatively in your own language and culture?`,
 placeholder:`He can be a bit too optimistic at times…`},
{id:'c7',src:'cb',code:'C7',title:'Discussion: is Alex a role model?',type:'open',
 prompts:[`Alex might be successful, but is he happy? What are your views?`,`Is there anything about Alex’s approach to life you would choose for yourself? Why?`,`Do you think Alex is a good example to younger people? Could he be a role model (a person who inspires others to copy them)?`]},
{id:'c8',src:'cb',code:'C8',title:'Improving a description',type:'open',
 passage:`<p>I’ve known my friend Shannon for six years. We met when we were both at primary school. We were ten. She had really long red hair. Her hair was wavy. It was tied back with a green ribbon. That’s the first thing I noticed about her.</p><p>Shannon is loyal, quiet, considerate, tidy, imaginative and cheerful. She used to be shy but now she’s more confident. She’s forgetful, too. There are some things I really admire about her.</p><p>She loves spiders. She wants to be an architect when she’s older.</p>`,
 instr:`Does this description give you a good mental picture of Shannon? Rewrite it to make it better: link sentences, choose fewer adjectives and give examples.`,
 model:[`I’ve known my friend Shannon for six years, since we were both ten and at primary school together. The first thing I noticed about her was her long, wavy red hair, which was always tied back neatly with a green ribbon – typical of such a tidy, organised person.`,`Shannon is incredibly loyal: when other girls teased me in my first week, she was the only one who sat with me at lunch. She used to be rather shy, but now she’s much more confident, and her imagination amazes me. She’s fascinated by spiders, of all things, and she wants to become an architect, designing buildings inspired by their webs!`,`She can be a little forgetful at times – she has left her phone on the bus more than once – but she’s always cheerful, and I really admire her.`]},
{id:'c9',img:'img/hassan.jpg',imgAlt:`A smiling teenage boy`,imgMode:'side',cap:``,src:'cb',code:'C9',title:'Comparing style: Hassan',type:'mcq',inline:true,
 passage:`<p>I’ve known Hassan since we met at a summer drama school as seven year olds, many years ago. I remember he was wearing red trousers and a bright-yellow woolly hat, which he never wanted to take off. This was typical of his loud and outgoing personality, and he’s still like that now!</p><p>Something people admire about Hassan is his ability to cheer people up when things go wrong. Last week he took a group of younger children for a football-themed birthday picnic in the countryside – but we forgot the footballs! So instead, Hassan entertained the kids with funny stories and organised a game of hide-and-seek, which they loved. He’s a good listener, too, so when I was upset because my dad was in hospital, he encouraged me to talk about how I was feeling. He’s very generous in giving up his time for other people, although he can be a bit unreliable with time-keeping in his own life. He’s always turning up late for meetings, cinema trips, even exams, which gets him into trouble sometimes – but then he’ll walk in with a lovely smile and everyone will forgive him!</p>`,
 instr:`Which improvements does the Hassan description show, compared with the Shannon text?`,
 items:[{q:`It gives specific examples of his behaviour.`,o:[`Yes`,`No`],a:0},{q:`It lists as many adjectives as possible.`,o:[`Yes`,`No`],a:1},{q:`It links his clothes to his personality.`,o:[`Yes`,`No`],a:0},{q:`It mentions a negative feature politely.`,o:[`Yes`,`No`],a:0},{q:`It uses mostly short, simple sentences.`,o:[`Yes`,`No`],a:1},{q:`It describes everything about his appearance.`,o:[`Yes`,`No`],a:1}]},
{id:'c10',src:'cb',code:'C10',title:'Writing your own description',type:'open',words:[120,200],
 instr:`Choose someone you know and describe them.`,
 checklist:[`I chose just a few key characteristics and gave specific examples.`,`Physical features or clothes are linked with character traits.`,`I used some adjectives from C1 and C3, but didn’t overdo it.`,`I linked short sentences together.`,`I included one negative personality feature – politely!`]},

{id:'wc4',src:'wb',code:'WB C4',title:'Commenting on positive and negative qualities',type:'gap',dropdown:true,para:true,
 instr:`Exaggerate Nadine’s positive qualities and tone down the negative ones. Some words fit more than one gap.`,
 bank:[`always`,`incredibly`,`rather`,`absolutely`,`by far`,`can be`,`so`,`a little bit`,`great`,`extremely`,`the best`,`slightly`],
 items:[`Nadine’s my best friend and is {by far} the nicest person I know. She’s a nurse and is {incredibly|extremely|so} hard-working. She often works long shifts at the hospital but never complains about it. She’s also {extremely|incredibly|so} generous, with both her time and her money, and is willing to help {absolutely} anyone if she can.`,
 `Sometimes, though, Nadine can be {a little bit|slightly|rather} unreliable if you make an arrangement with her. I’ve known her to be two hours late, for example, which can be {rather|slightly|a little bit} annoying. She {can be} {slightly|a little bit|rather} difficult to contact too, because she isn’t {the best|always great|great} at answering her phone!`,
 `It’s a {great} privilege to know Nadine and I’m {so|extremely|incredibly} proud to be her friend!`]},

{id:'wc6',src:'wb',code:'WB C6',title:'Developing your writing style',type:'open',
 passage:`<p>This is my grandmother. She is old. She is small. She has got fair skin. She has got brown eyes. She has white hair. She has a nice personality. She has got a bad leg. She smiles a lot but she has pains in her knee. She has arthritis. She paints pictures of things like birds, animals and flowers. She remembers my birthday. She buys me nice presents. She wears a gold locket around her neck. It is from my grandfather. He bought it for her when they got married. She likes it very much.</p>`,
 instr:`Rewrite this social-media description using longer, more complex sentences.`,
 model:[`This is my grandmother, a small, elderly lady with fair skin, warm brown eyes and soft white hair. Although she suffers from arthritis and often has pain in her knee, she is always smiling, and she has the kindest personality of anyone I know.`,`She spends her afternoons painting beautiful pictures of birds, animals and flowers, and she never forgets my birthday, always choosing a lovely present for me. Around her neck she wears a gold locket which my grandfather bought her when they got married, and it is clearly her most treasured possession.`]},

{id:'d2',src:'cb',code:'D2',title:'Discussion: who do you look up to?',type:'open',instr:`Write down the names of three people you look up to. Why should these people be admired? Did you choose living people or historical figures?`},
{id:'d3',src:'cb',code:'D3',title:'Pre-listening: glossary',type:'mcq',
 tip:`<b>Dubai</b> – one of the seven emirates of the United Arab Emirates (UAE) · <b>Saudi Arabia</b> – a country in Western Asia · <b>Zhejiang</b> – a province in eastern China, next to the East China Sea · <b>Nobel prize</b> – one of six international prizes awarded each year (chemistry, physics, medicine, literature, peace, economics)`,
 items:[{q:`What do we mean by <b>people with special needs</b>?`,o:[`people with a disability or condition who need extra help or support`,`people who need a lot of money`,`people who are very talented`],a:0},{q:`If someone is <b>named after</b> their mother, …`,o:[`they were given their mother’s name`,`they were born after their mother died`,`their mother chose their name`],a:0}]},
{id:'d4',src:'cb',code:'D4',title:'Listening: podcast',type:'mcq',track:'Track 1.3',img:'img/tu.jpg',imgMode:'side',imgAlt:'Tu Youyou receiving the Nobel Prize',cap:'Tu Youyou was awarded the Nobel Prize in Physiology or Medicine in 2015.',
 instr:`Listen to a podcast recorded for a student radio station. Choose the best answer for each question.`,
 audio:[{who:'Interviewer',v:0,t:`OK, Yasmin, so we’re here to conduct the next in our series of podcasts on people we look up to. Yesterday we had an interesting discussion on the architect Zaha Hadid and her groundbreaking designs… Can you tell us whose achievements you’d like to talk about today?`},
 {who:'Yasmin',v:1,t:`Well, I’m going to break the rules a little bit, if you don’t mind, because I couldn’t decide on a single person to focus on. It was really hard to narrow it down!`},
 {who:'Interviewer',v:0,t:`Yes, I’m sure it was! Well, I think we can let you do that. So how did you choose in the end?`},
 {who:'Yasmin',v:1,t:`You know, I got to thinking about why we admire people, and I realised it’s complicated. We can admire someone’s achievements without necessarily liking the way they went about doing what they did – or, on the other hand, we may admire a person’s courage or their originality, for example, without agreeing with their beliefs. And society changes, too – so we name a street or building after someone, and then a hundred years later, our values have changed and we’re questioning whether those people really deserve to be remembered in that way.`},
 {who:'Interviewer',v:0,t:`I hadn’t really thought of it like that; that’s a good point. But you’ve decided on someone you feel you actually can look up to?`},
 {who:'Yasmin',v:1,t:`OK, yes I have, two people, actually, who a lot of our listeners may not have heard of. I’d like to start off with a man from Dubai called Jalal Bin Thaneya – I heard about him from my mother, who comes from that part of the world. He’s completed some incredible physical challenges, including cycling 5000 kilometres from Oman to Jeddah in Saudi Arabia, and twice walking across all seven of the United Arab Emirates alone – that’s a distance of around 800 kilometres.`},
 {who:'Interviewer',v:0,t:`Quite a long way, then!`},
 {who:'Yasmin',v:1,t:`And you have to bear in mind that he would have been walking in extreme heat, on dusty, unpaved desert and mountain roads where there’s hardly anything to see, and with little food. As a long-distance walker myself, I can imagine how mentally tough that must have been. But what impresses me most actually, is that he’s raised huge amounts of money for various charities supporting people with special needs in the UAE, and generally he’s done a lot to make people more aware of the issues around disability. Now, it’s interesting that people often support a charity that has a particular connection with their own family, and that’s great… but Jalal Bin Thaneya has no reason to support those particular charities other than just wanting to help. He feels quite strongly that people don’t talk enough about some of the difficulties in society until those difficulties affect them personally.`},
 {who:'Interviewer',v:0,t:`And you say you’re going to tell us about another person who impresses you as well?`},
 {who:'Yasmin',v:1,t:`Yes, but for completely different reasons this time. For my own medical studies, I’d been finding out about how to look after patients suffering from malaria—`},
 {who:'Interviewer',v:0,t:`The tropical disease spread by mosquitoes, right?`},
 {who:'Yasmin',v:1,t:`Yes, exactly. Well, I was learning about that, and I found out about the Chinese scientist Tu Youyou, who discovered a very important anti-malaria drug called artemisinin, which comes from a tree. The work she did has helped save millions of people’s lives in China and South-East Asia generally, so I had to choose her.`},
 {who:'Interviewer',v:0,t:`She won the Nobel Prize, didn’t she?`},
 {who:'Yasmin',v:1,t:`Yes, that’s right, she did. Well, Tu Youyou was born in Zhejiang province in eastern China in 1930, and she trained as a pharmaceutical scientist during China’s Cultural Revolution, at a time when it really wasn’t easy to be a scientist.`},
 {who:'Interviewer',v:0,t:`No, I can imagine.`},
 {who:'Yasmin',v:1,t:`Thousands of people were dying of malaria, and there was a lot of pressure to find a treatment for it. She eventually found a clue to an effective cure by reading about ancient Chinese medicine in a text hundreds of years old. So she tried it out on herself and her team, which must have been pretty brave. Then she and the team had to create the drug, using some toxic chemicals which damaged their health. She didn’t get to see her family during this period, either, so she had to make quite a lot of personal sacrifices. And she got very little thanks or recognition for her work at the time – it wasn’t until she was in her seventies that people heard about her awards and began to take an interest.`},
 {who:'Interviewer',v:0,t:`It sounds as if Tu Youyou deserves to be more well-known than she actually is – and it’s good that you’ve told us about her today.`},
 {who:'Yasmin',v:1,t:`Yes, it’s not always the most famous people who most deserve our admiration, is it?`},
 {who:'Interviewer',v:0,t:`No, I’d agree.`}],
 items:[
 {q:`According to Yasmin:`,o:[`we can’t admire someone if we don’t agree with their beliefs.`,`over time, we change the way that we judge people’s achievements.`,`we shouldn’t name streets or buildings after people who don’t deserve our admiration.`],a:1},
 {q:`Yasmin understands how hard the walk across the seven Emirates is because:`,o:[`she has done it herself.`,`she has personal experience of similar activities.`,`she has a good imagination.`],a:1,e:`“As a long-distance walker myself…”`},
 {q:`Yasmin says that Jalal Bin Thaneya wanted to complete his challenges in order to:`,o:[`improve the lives of people with special needs.`,`support people with special needs, including someone in his family.`,`make people realise that disability affects them personally.`],a:0,e:`He has “no reason to support those particular charities other than just wanting to help”.`},
 {q:`According to Yasmin, what did Tu Youyou do that showed courage?`,o:[`She decided to look for a cure for malaria.`,`She worked away from her family.`,`She tested the new medicine on herself.`],a:2},
 {q:`According to Yasmin, did Tu Youyou’s anti-malaria medicine make her famous?`,o:[`Not at first, but people found out about her many years later.`,`She was well-known at first, but now she’s forgotten.`,`It made her more famous than she deserves.`],a:0}]},
{id:'d5',src:'cb',code:'D5',title:'Discussion: fame and admiration',type:'open',
 prompts:[`Do you agree with Yasmin about admiring people? Can we admire someone’s work (their art or sports skills) if we dislike the way they lead their life?`,`Why do we put up statues of people? Would it be better not to?`,`Tu Youyou only became well-known when she was in her seventies. Do you know of other people who became famous only when they were very old, or after their death?`,`If you made an important discovery, would you want to be famous for it? What might be the advantages of not being well-known?`]},
{id:'d6',img:'img/surgery.jpg',imgAlt:`Surgeons operating in a modern operating theatre`,imgMode:'side',cap:`Imagine this scene in the 1840s.`,src:'cb',code:'D6',title:'Writing from notes: Joseph Lister',type:'open',
 passage:`<p><i>I want / describe Joseph Lister. He be / surgeon who / be born / England / 1827. In those days / many patients die / after operations because their wounds / become / badly infect. Lister wonder if / bacteria / air / which make / meat decay / also make / wounds septic.</i></p><p><i>Lister decide / clean / everything which touch / patient’s wounds / carbolic acid. Carbolic acid / destroy / all germs. As a result / these precautions / patients recover quickly / operations. The rate / infection / fall dramatically.</i></p><p><i>Lister develop / safe, antiseptic operations / which be / major medical advance. He receive / many awards / his work / and today / known as ‘the father of modern surgery’. I admire him because / he be dedicated / unselfish. He take / great personal risks / make this discovery. Surgery / use to be / highly dangerous. People be / terrify / surgeon’s knife. Lister change / all that. Modern surgery be / life-saver.</i></p><p class="meta">bacteria: organisms that cause disease · decay: go bad, rot · septic: badly infected · precautions: actions taken to avoid danger</p>`,
 instr:`Write the description of Joseph Lister in full. Change the form of some words and add others.`,
 model:[`I want to describe Joseph Lister. He was a surgeon who was born in England in 1827. In those days, many patients died after operations because their wounds became badly infected. Lister wondered if the bacteria in the air which made meat decay also made wounds septic.`,`Lister decided to clean everything which touched the patients’ wounds with carbolic acid. Carbolic acid destroyed all the germs. As a result of these precautions, patients recovered quickly from operations. The rate of infection fell dramatically.`,`Lister developed safe, antiseptic operations, which were a major medical advance. He received many awards for his work, and today he is known as ‘the father of modern surgery’. I admire him because he was dedicated and unselfish. He took great personal risks to make this discovery. Surgery used to be highly dangerous. People were terrified of the surgeon’s knife. Lister changed all that. Modern surgery is a life-saver.`]},
{id:'d7',img:'img/wanted.jpg',imgAlt:`WANTED – nominations for Local hero of the year`,imgMode:'side',cap:``,src:'cb',code:'D7',title:'Looking for a ‘local hero’',type:'open',
 passage:`<h3>WANTED: Nominations for the award of ‘Local hero of the year’</h3><p>Do you know someone who volunteers regularly to make a difference in our town? Or perhaps they have worked especially hard helping the public, always with a smile, and have never been thanked? Or maybe they did that one extra special brave or kind thing that deserves recognition?</p><p>Tell us about them, and they may win a prize at our ‘Local hero of the year’ ceremony! Let us know: • who they are and what they are like • what they do (or have done) that deserves an award.</p><p>Please email your nomination to the forum administrator.</p>`,
 instr:`Think about who you might nominate, and why (you can make someone up). Make notes.`,placeholder:`Who? What are they like? What have they done?`},
{id:'d8',img:'img/students.jpg',imgAlt:`Two students reading and discussing a draft`,imgMode:'side',cap:``,src:'cb',code:'D8–9',title:'Drafting your nomination',type:'open',words:[150,250],
 tip:`<b>Structure.</b> <i>Introduction</i> – say why you are writing: <i>I am writing to nominate [the person] for… / I hope that you will consider [the person]…</i> · <i>Middle</i> – who the person is and what they do / have done · <i>Ending</i> – briefly summarise why they deserve the award.<br>Your reader is the forum administrator and other adults you don’t know: use a <b>formal, respectful</b> register.`,
 checklist:[`The nomination is convincing – I would give this person the award.`,`The tone is suitable: not too informal, not too formal.`,`I checked spelling and apostrophes.`,`I used the three-part structure.`],
 model:[`Dear Forum Administrator,`,`I am writing to nominate Mrs Olena Kovalenko for the award of ‘Local hero of the year’.`,`Mrs Kovalenko is a retired primary school teacher who lives on our street. For the past five years she has run a free homework club in the community centre every Tuesday and Thursday afternoon. Around twenty children attend each week, many of whom have parents working late. She helps them with reading and maths, and she always brings fruit and biscuits that she pays for herself.`,`Mrs Kovalenko is incredibly patient and kind. When my younger brother was struggling with reading and had lost all his confidence, she spent extra time with him every week. Now he reads books for pleasure. Many other families have similar stories.`,`She has never asked for any thanks, which is exactly why I believe she deserves this recognition. I hope that you will consider her for the award.`,`Yours faithfully,<br>Iryna Berezka`],modelLabel:'Model nomination'},

{id:'wd3',src:'wb',code:'WB D3',title:'Listening: a talk about Frida Kahlo',type:'mcq',track:'Workbook Audio 2',
 instr:`You will hear a student giving a talk about a Mexican artist called Frida Kahlo. Choose the correct answer.`,
 audio:[{who:'Student',v:1,t:`Hi everyone, and welcome to my talk about the incredible Mexican artist Frida Kahlo. She came from a family of mixed heritage; her mother’s side of the family being a combination of Spanish and Amerindian – the original inhabitants of North, Central and South America – while the other side of the family had arrived in Mexico from Germany several years before.`},
 {who:'Student',v:1,t:`Frida caught a serious disease called polio when she was just six years old. This made walking very hard for her, at least to begin with, but her father urged her to take up swimming and even soccer to help develop her strength again. Frida later wrote that her relationship with her father was extremely close, so she was keen to follow his advice.`},
 {who:'Student',v:1,t:`When she was 18, Frida was on her way home from school when the bus she was in crossed in front of a tram, which unfortunately hit the side of the bus. Many passengers climbed from the wrecked bus with minor injuries, but Frida was badly hurt. It was while recovering from the accident that Frida started painting seriously.`},
 {who:'Student',v:1,t:`Frida got married to a famous artist called Diego Rivera in 1929, and they moved to the United States together in 1931. Even though their political beliefs occasionally got them into trouble with the authorities, they were both successful so had no shortage of money. However, she missed Mexico, so they decided to go back there in 1933.`},
 {who:'Student',v:1,t:`Frida’s striking paintings are often interpreted as products of her imagination. Frida commented, however, that they were actually her way of showing visually the many different feelings she experienced in her life. She saw painting as the best way of expressing them, and her art came to be admired by many. So despite all of her setbacks in life, Frida achieved great success in her lifetime and is often described as one of the most important artists of the 20th century.`}],
 items:[{q:`Frida’s father’s family were originally from`,o:[`South America`,`Germany`,`Spain`],a:1},{q:`Frida was encouraged to ___ while recovering from an illness called polio.`,o:[`do sport`,`try writing`,`go walking`],a:0},{q:`Frida had an accident while ___, which left her in a lot of pain.`,o:[`climbing`,`crossing the road`,`using public transport`],a:2},{q:`Frida returned to Mexico from the United States because she`,o:[`held strong political beliefs`,`was in poor health`,`felt homesick`],a:2},{q:`Frida says that her paintings were always about the many things she`,o:[`saw`,`felt`,`imagined`],a:1}]},
{id:'wd4',src:'wb',code:'WB D4',title:'Draft and redraft a structured email',type:'open',words:[150,250],
 passage:`<p><b>Notes:</b> Literacy very important: people’s happiness &amp; personal development + development of country · Research studies: people unable read/write → more likely dissatisfied with lives + lack confidence + find getting job difficult · In addition: can’t help their children (schoolwork) / play active part in community · Find ordinary things difficult (read newspapers / fill in forms) · Many not use internet / social media · Some feel ashamed – cover up problems / pretend can read · Very important these people get help · In our area: literacy scheme – help adults improve reading / writing skills · Schemes like this → help government achieve goal (100 percent literacy our country)</p>`,
 instr:`Vicki Sansa is writing to a newspaper about improving literacy standards. Use the notes to write the full email. Begin <i>Dear Editor,</i> and end <i>Yours faithfully,</i>.`,
 model:[`Subject: Re: Improving literacy standards`,`Dear Editor,`,`I am writing in response to your recent article on literacy. In my opinion, literacy is extremely important, not only for people’s happiness and personal development but also for the development of our country.`,`Research studies show that people who are unable to read and write are more likely to be dissatisfied with their lives. They often lack confidence and find getting a job difficult. In addition, they cannot help their children with schoolwork or play an active part in the community. They find ordinary things, such as reading newspapers or filling in forms, difficult, and many of them do not use the internet or social media. Some feel so ashamed that they cover up their problems or pretend that they can read.`,`It is therefore very important that these people get help. In our area there is a literacy scheme which helps adults to improve their reading and writing skills. Schemes like this will help the government achieve its goal of 100 percent literacy in our country.`,`Yours faithfully,<br>Vicki Sansa`]},

S({key:'g',nav:'Grammar',letter:'G',eyebrow:'Language study & Grammar spotlight',title:'Apostrophes · Present simple and continuous',
blurb:'The two grammar points of Unit 1, with the coursebook and workbook practice and extra drills.',ex:[
{id:'g0',src:'cb',code:'D10',title:'Why the apostrophe?',type:'mcq',
 tip:`We use an apostrophe (’) for two main purposes: to show where letters are <b>omitted</b> (contractions) and to show <b>possession</b>.<span class="ua">Апостроф: 1) пропущені літери (it’s = it is); 2) належність (Anna’s bag).</span>`,
 items:[{q:`Someone<b>’s</b> put a lot of effort into this.`,o:[`letters omitted (someone has)`,`possession`],a:0},{q:`I found someone<b>’s</b> phone under the sofa.`,o:[`letters omitted`,`possession (the phone belongs to someone)`],a:1}]},
{id:'g1',src:'cb',code:'D10.1',title:'Contracted forms',type:'gap',
 instr:`Write the full (non-contracted) form of the words in bold.`,
 items:[`<b>You’re</b> going to watch a film with friends. → {You are}`,`He disappeared to Malaysia, where <b>he’s</b> lived happily ever since. → {he has}`,`<b>Don’t</b> set the wrong goals in the first place. → {Do not}`,`<b>You’ll</b> be fine. → {You will}`,`When Ravi was alive, <b>I’d</b> ask him to do the things I couldn’t cope with. → {I would}`,`I explained that <b>I’d</b> left my glasses at home. → {I had}`,`<b>He’s</b> always turning up late for meetings. → {He is}`]},
{id:'g2',src:'cb',code:'D10.2',title:'Possession: work out the rules',type:'mcq',
 passage:`<p>These are my husband<b>’s</b> keys. · My brother<b>s’</b> names are Phil, Matt and Billy. · I spoke to the children<b>’s</b> favourite teacher. · You should listen to other people<b>’s</b> opinions.</p>`,
 items:[{q:`Singular owner (husband):`,o:[`add ’s`,`add s’`],a:0},{q:`Regular plural owner ending in -s (brothers):`,o:[`add ’s (brothers’s)`,`add only ’ after the s (brothers’)`],a:1},{q:`Irregular plural not ending in -s (children, people, women, men):`,o:[`add ’s (children’s)`,`add only ’ (childrens’)`],a:0},{q:`“My brother’s names are Phil, Matt and Billy” means…`,o:[`I have one brother`,`I have three brothers`],a:0,e:`One brother with three names! For three brothers we write brothers’.`}]},
{id:'g3',img:'img/signs.jpg',imgAlt:`Signs with apostrophe mistakes`,imgMode:'side',cap:``,src:'cb',code:'D10.3',title:'What’s wrong with the signs?',type:'mcq',
 items:[{q:`<i>Please leave ALL trolley’s next to the supermarket exit.</i>`,o:[`trolley’s should be trolleys – a simple plural needs no apostrophe`,`ALL should be lower case`,`It should be trolleys’`],a:0},{q:`<i>Please note: our store has changed it’s opening hours.</i>`,o:[`it’s should be its – possessive its has no apostrophe`,`has should be have`,`It should be it’s’`],a:0,e:`it’s = it is / it has. its = belonging to it.`}]},
{id:'g4',src:'cb',code:'Spotlight',title:'Present simple and continuous',type:'gap',
 tip:`<b>Present simple</b> – facts, habits, things usually or always true: <i>I avoid the kind of situations that may hurt me.</i><br><b>Present continuous</b> – things happening now / around now: <i>Monica is describing how it feels… She is sitting in her flat.</i><br><b>Stative verbs</b> don’t usually take the continuous form: believe, belong, contain, know, like, love, mean, own, prefer, seem, suppose, understand, want, wish. <i>I don’t understand. Can you explain that again?</i><span class="ua">Present simple — звички й факти; present continuous — те, що відбувається зараз. Дієслова стану (know, like, want…) зазвичай не мають -ing.</span>`,
 instr:`Complete the sentences with the correct present tense of the verb in brackets.`,
 items:[`That’s strange – Josh {is arguing|'s arguing} with his friend Ken. He never normally {argues} with anyone. (argue)`,`You {seem} very quiet this morning. Are you OK? (seem)`,`Tanya is very generous. Helping other people {makes} her happy. (make)`]},
{id:'g5',src:'wb',code:'WB D5',title:'Apostrophes: omission',type:'rewrite',prefill:true,
 instr:`Add the missing apostrophes. Edit the sentence in the box.`,
 items:[{q:`I havent decided what to wear to the party yet.`,a:`I haven't decided what to wear to the party yet.`},{q:`I wish youd be more careful. Youre always breaking things.`,a:`I wish you'd be more careful. You're always breaking things.`},{q:`Shes got a son, Rory, whos nine.`,a:`She's got a son, Rory, who's nine.`},{q:`Dont you think youd better wear a coat - its raining?`,a:[`Don't you think you'd better wear a coat - it's raining?`]},{q:`Lets meet soon for a coffee. Its ages since Ive seen you.`,a:`Let's meet soon for a coffee. It's ages since I've seen you.`},{q:`He doesnt know where theyve gone, does he?`,a:`He doesn't know where they've gone, does he?`},{q:`Arent you hot in that thick sweater?`,a:`Aren't you hot in that thick sweater?`},{q:`This coffees lost its flavour.`,a:`This coffee's lost its flavour.`}]},
{id:'g6',src:'wb',code:'WB D5',title:'Apostrophes: possession',type:'rewrite',prefill:true,
 tip:`Put the apostrophe after the ‘owner’. If the owner is plural and ends in -s, the apostrophe goes after the s: <i>the students’ books</i>.`,
 items:[{q:`Hu Chengs parents carefully read his class teachers report.`,a:`Hu Cheng's parents carefully read his class teacher's report.`},{q:`All three of the sisters cars were repaired in Eddies garage.`,a:`All three of the sisters' cars were repaired in Eddie's garage.`},{q:`The students ID cards were checked by the colleges security guard.`,a:[`The students' ID cards were checked by the college's security guard.`,`The student's ID cards were checked by the college's security guard.`]},{q:`The politicians listened to all of the peoples opinions.`,a:`The politicians listened to all of the people's opinions.`},{q:`I think womens professional football teams should be paid as much as mens.`,a:`I think women's professional football teams should be paid as much as men's.`},{q:`Alicias cat ran across several of her neighbours gardens.`,a:`Alicia's cat ran across several of her neighbours' gardens.`}]},
{id:'g7',src:'wb',code:'WB D5',title:'Apostrophes: both uses',type:'rewrite',prefill:true,
