S({key:'e',nav:'Exam practice',letter:'E',eyebrow:'Exam-style questions',title:'Exam practice',
blurb:'Reading, writing, listening and speaking tasks in IGCSE format, plus the end-of-unit reflection.',ex:[
{id:'e1',src:'cb',code:'Reading',title:'Can you cure a phobia?',type:'gap',
 passage:`<h3>Can you cure a phobia?</h3>
<p>Phobia sufferers experience extreme fear of something that’s unlikely to harm them. Taking your children to feed the ducks is a normal and pleasurable activity for most parents. But for Kelly Phillips, a young mother of two, it posed a terrifying challenge. Kelly has had a phobia about birds since childhood. Even seeing one on the roof or flying high above her would throw her into a blind panic. The disorder, called ornithophobia, had ruined her life, and meant that she struggled even to do the shopping in case she encountered a bird on the way there.</p>
<p>But what lies behind such fears? People with phobias have a pure, illogical terror of an object or situation, often convincing themselves that something disastrous is about to happen. So people afraid of spiders (arachnophobes) may fear they will be poisoned by a bite, while those with claustrophobia (fear of closed spaces) will avoid using a lift, imagining it will break and they will be left to die. Their fear then provokes physical symptoms such as rapid breathing, sweating and a fast-beating heart. Such reactions are part of the ‘fight or flight’ response, which can be useful for life and death situations, such as if there is a lion nearby. But for phobias, it’s no use telling people they are not thinking sensibly: they already know that.</p>
<p>It wasn’t clear what started Kelly’s ornithophobia. It might have been a reaction to a bird flying at her as a child, as witnessed by her elder sister, since very upsetting incidents in childhood can generate such fears. (Some claustrophobics recall being trapped in a crowded place for a long period, for instance.) Over-anxious parents giving off signals that certain things are dangerous can also be responsible; this is most probably the case for Kelly, with teasing from classmates adding to her fears. Whatever the cause, sufferers may be left too scared even to go for a walk on their own.</p>
<p>Kelly agreed to take part in a step-by-step treatment programme, with other ornithophobics, beginning with a trip to a park to feed the birds. Even coming into contact with bird food left quite a few participants in tears and threatening to walk off, but one or two in the group managed to help the others through it. The next step was visiting a zoo, where each had to handle a small bird that was used to humans.</p>
<p>The sufferers were taught to deal with their anxiety symptoms by focusing on breathing and relaxation, and distracting themselves from their negative thoughts by focusing on something in the here and now; for example, the wallpaper, or even their own feet.</p>
<p>For the final step, the group had to handle larger, mice-hunting birds. The purpose here was for them to realise for themselves that, despite their appearance, these rather terrifying-looking creatures are harmless. It was an important exercise as phobics tend to generalise, believing all birds – or all spiders, for example – are a threat. Kelly chose a small bird that hopped onto her head, from where she had to pull it onto her hand.</p>
<p>So, did these experiences help? Well, we revisited those who took part in the programme, and all reported having overcome their fears. As for Kelly, she is a changed woman. Despite some minor panic attacks, she has learnt to deal with her anxiety. She even sent us a happy family shot of her with her family feeding the ducks in the park.</p>`,
 instr:`Answer in a few words. The checker accepts the key words; compare with “Show answers” if yours is marked wrong but means the same. [Total: 8]`,num:true,
 loose:true,items:[`When did Kelly’s phobia begin? {in childhood|childhood|child}`,`What is the name for the body’s reaction to an emergency such as a dangerous animal? {the ‘fight or flight’ response|fight or flight}`,`According to the article, who is most likely to have caused Kelly’s phobia? {her over-anxious parents|parent}`,`Why did the programme advise the ornithophobics to stare at their feet? {to distract themselves from negative thoughts|distract|here and now}`,`What important fact were participants supposed to learn in the last part of the programme? {the birds are harmless|harmless|not a threat|not dangerous}`,`Everyday activity 1 (not feeding birds) that is stressful for phobia sufferers: {doing the shopping|shop|lift|walk}`,`Everyday activity 2: {using a lift|lift|shop|walk}`,`Everyday activity 3: {going for a walk on their own|walk|shop|lift}`]},
{id:'e2',src:'cb',code:'Writing 1',title:'Informal email: something that scared you',type:'open',words:[120,160],
 instr:`You recently had to do something that made you feel scared. Write an email to tell a friend about it. In your email, you should:`,
 prompts:[`describe what you had to do and how you felt about it`,`explain how you overcame your fear`,`say what you have learnt from this experience.`],
 checklist:[`Friendly opening and closing (Hi…, Love / See you soon…)`,`All three bullet points covered`,`Informal language and contractions`,`Fear expressions from B2`,`120–160 words`],
 model:[`Hi Sofia,`,`Guess what? Last Friday I had to give a presentation in front of the whole school! To tell you the truth, I was terrified. I felt sick every time I thought about it, and the night before I hardly slept.`,`In the end, my older brother helped me. He made me practise in front of the family three times, and he told me to look at one friendly face in the audience. On the day, I took a few deep breaths, found my friend Max in the second row and just talked to him. My hands were shaking for the first minute, but then I actually started to enjoy it!`,`I’ve learnt that preparation really is the key – and that things are rarely as bad as you imagine. Next time I won’t panic so much.`,`Write soon and tell me your news!<br>Iryna`]},

{id:'e4',src:'cb',code:'Writing 3',title:'Formal report: a welcome video',type:'open',words:[120,160],
 instr:`Your school is planning to make a video to help younger students who will be starting next year feel welcome and less nervous. Your headteacher wants your class’s opinions, and you have been asked to write a report. Say why a video is a good idea, and suggest what should be included. Use these comments and your own ideas:`,

{id:'e5',src:'cb',code:'Listening',title:'Interview with a teenage blogger',type:'mcq',track:'Track 1.4',
 instr:`You will hear Victor, a radio presenter, asking Carlos Gomez, a teenage blogger, some questions about his hobby as part of a radio feature on developing potential in young people. For each question, choose the correct answer. You will hear the interview twice. [Total: 8]`,
 audio:[{who:'Presenter',v:0,t:`Today we have an exciting guest, teenage blogger Carlos Gomez. Welcome to the show, Carlos.`},
 {who:'Carlos',v:1,t:`Thank you, Victor. Pleased to be here.`},
 {who:'Presenter',v:0,t:`Our listeners would love to hear about your amazing blog, boyzownzone, which is one of the most successful in the blogosphere. What do you blog about?`},
 {who:'Carlos',v:1,t:`Anything! Well, that’s not strictly true. I’m very selective about what I blog about. A blog – it says a lot about you as a person.`},
 {who:'Presenter',v:0,t:`That’s a good point. I suppose blogging gives everyone the opportunity to give their opinions and, well, just be yourself. And there are certainly some amazing blogs on the internet.`},
 {who:'Carlos',v:1,t:`There are some fabulous blogs for teenagers, but they are mainly for teenage girls. If I’m honest, the motive for doing my blog in the first place was that I thought it was something I could achieve. I said to myself, ‘Carlos, come on, start your own blog. It can’t be all that hard.’ I wanted to achieve a blog that would be interesting to read.`},
 {who:'Presenter',v:0,t:`So you blog about your daily life, what you’re doing at the moment, with a focus on activities boys like?`},
 {who:'Carlos',v:1,t:`That is absolutely correct. I love blogging about scientific inventions… that is one of my favourite things. I used to focus on teenage boy inventors, but now I write about anyone who deserves recognition even if many people haven’t heard of them or their work.`},
 {who:'Presenter',v:0,t:`You have sections dedicated to different topics: music, art, football. It’s not all about inventions.`},
 {who:'Carlos',v:1,t:`And don’t forget my book review section! I am a reading fanatic and have reviewed some amazing books. People say boys only want to watch action movies or play on the PlayStation, but now I get loads of hits from boys about books I recommend. I also get comments from little kids, mums, dads and grandparents who want to buy books for their grandchildren. One lady asked her local bookseller for one of the books I’d recommended and he said that the book became his bestselling book overnight.`},
 {who:'Presenter',v:0,t:`Sounds like you have made reading cool. That is not bad.`},
 {who:'Carlos',v:1,t:`I got a brilliant post from a boy who said that he used to be anti-reading unless it was social media, and he wasn’t very interested in that. He used to play computer games all the time. Then he started reading The Dark in Their Eyes, which is the horror series I blog about. I guarantee these books are as thrilling as any action movie. He says he’s now a reading addict, just as I am. His friends can’t believe it! He’s a total bookworm!`},
 {who:'Presenter',v:0,t:`I hear you are interested in the Wonderworld series of comic books. They have very unusual drawings, don’t they?`},
 {who:'Carlos',v:1,t:`Wonderworld is laugh-out-loud funny. Comic books with a difference! My family say the illustrations are strange and they would prefer pictures of flowers or sunsets, but that kind of art leaves me unimpressed. I look up to those artists who create the artwork – they are so talented. If I ever win the lottery, I’m going to buy the original artworks and put them on my bedroom wall. The Wonderworld books are expensive but they are definitely worth it. I persuaded my school library to buy a set of Wonderworld and now almost everyone at school is on the waiting list!`},
 {who:'Presenter',v:0,t:`How do you find time for all this?`},
 {who:'Carlos',v:1,t:`Blogging makes me happy and is a priority. Some bloggers communicate almost constantly but, although I love sharing my news, I think quite carefully before I update my blog. However, people visit my site almost daily so I do not want to let them down by not updating. I post up a page when I get a free evening or when there is a quiet lunchtime at school.`},
 {who:'Presenter',v:0,t:`Any tips for would-be bloggers who might be listening now?`},
 {who:'Carlos',v:1,t:`Just go for it. Don’t let your spelling or anything hold you back. People don’t judge you. My grammar and spelling used to be rubbish but blogging has made my literacy better. What matters most is the people who are going to read your blog, so think about what they would like. Using appealing pictures makes a big difference to the blog as well.`},
 {who:'Presenter',v:0,t:`What are your future goals?`},
 {who:'Carlos',v:1,t:`If I have a future goal, it’s to meet one of the wonderfully talented people I have blogged about. Just to get a post from one of them would be a dream come true.`},
 {who:'Presenter',v:0,t:`Thank you, Carlos. We’ve had lots of texts coming in from listeners while we’ve been talking. Here is one from…`}],
 items:[
 {q:`The main reason Carlos started his blog was because:`,o:[`teenage blogs are very interesting to read.`,`he thought he had the skills to write a blog.`,`other blogs mainly reflected the interests of teenage boys.`],a:1},
 {q:`When choosing to write about inventors, Carlos concentrates on:`,o:[`teenage boy inventors.`,`famous inventors.`,`little-known inventors.`],a:2},
 {q:`Carlos’s book review section is popular with:`,o:[`people of all ages.`,`booksellers.`,`shopkeepers.`],a:0},
 {q:`One of the boys reading his blog changed from:`,o:[`watching action movies to reading.`,`posting comments on social media to reading.`,`playing computer games to reading.`],a:2},
 {q:`What does Carlos think about the artwork in the series of Wonderworld books?`,o:[`He admires it.`,`He finds it weird.`,`He considers it not very good.`],a:0},
 {q:`We know the Wonderworld series is very popular at his school because:`,o:[`students have bought the original artwork.`,`many students are waiting for a copy.`,`students want to buy sets of the Wonderworld series.`],a:1},
 {q:`Carlos updates his blog on a regular basis because:`,o:[`he does not want to disappoint his regular readers.`,`he frequently has free time in the evening and at lunchtime.`,`he always has fresh news to share with users.`],a:0},
 {q:`His advice for those who want to write a blog is to:`,o:[`have an attractive visual presentation.`,`make it enjoyable for readers.`,`have good grammar and spelling.`],a:1}]},
